name: Latest Counts
on:
  schedule:
    # At 01:30 each day
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-counts
  cancel-in-progress: false

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: ctx-robertpetit.com-1-dev
          miniforge-version: latest

      - name: Test
        run: python -m pytest tests -q

      # A Provider failure still writes a partial snapshot; the collector exits
      # 0 and marks affected tools `incomplete`, so the data shows the gap.
      - name: Collect counts
        run: python scripts/collect_software_counts.py

      - name: Build
        run: hugo --gc --minify -b https://www.robertpetit.com

      - name: Commit and push
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/software-counts.yml metrics
          git diff --cached --quiet && exit 0
          git commit -m "ci: update software-counts.yml"
          git push
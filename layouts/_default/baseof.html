<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
{{ partial "head.html" . }}

<body>
  {{ if or .Page.IsSection .Page.IsHome }}
    {{ block "content" . }}{{ end }}
  {{ else if eq .Page.Section "tags" }}
    {{ block "content" . }}{{ end }}
  {{ else }}
    {{ block "single-content" . }}{{ end }}
  {{ end }}
  {{ partial "footer.html" . }}
  {{ partial "script.html" . }}
</body>
</html>
